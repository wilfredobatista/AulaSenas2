<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AulaSenas · Configurador</title>
    <style>
      :root { font-family: system-ui, sans-serif; color: #172033; background: #f5f7fb; }
      body { max-width: 1100px; margin: 0 auto; padding: 2rem; }
      header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
      main { display: grid; grid-template-columns: 1.3fr 1fr; gap: 1rem; }
      section { background: white; border: 1px solid #dfe5ef; border-radius: 12px; padding: 1rem; }
      video { width: 100%; min-height: 260px; background: #111827; border-radius: 8px; }
      label { display: grid; gap: .35rem; margin: .8rem 0; }
      input, select, button { font: inherit; padding: .55rem; border-radius: 6px; border: 1px solid #b8c2d4; }
      button { cursor: pointer; background: #1d4ed8; color: white; border: 0; }
      button.secondary { background: #475569; } button:disabled { opacity: .5; cursor: not-allowed; }
      .actions { display: flex; flex-wrap: wrap; gap: .5rem; margin: .8rem 0; }
      #status { min-height: 1.5rem; color: #334155; } .error { color: #b91c1c !important; }
      @media (max-width: 760px) { body { padding: 1rem; } main { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <header><h1>Configurador de señas</h1><span id="status" role="status">Listo</span></header>
    <main>
      <section>
        <h2>Video y captura</h2>
        <video id="preview" playsinline muted controls></video>
        <div class="actions">
          <button id="camera">Activar cámara</button>
          <button id="capture" disabled>Iniciar captura</button>
          <button id="stop" class="secondary" disabled>Detener</button>
          <label><span>Importar video</span><input id="video-file" type="file" accept="video/*" /></label>
        </div>
      </section>
      <section>
        <h2>Etiqueta y validación</h2>
        <button id="data-folder" class="secondary">Seleccionar carpeta data/</button>
        <label>Seña <input id="label" required maxlength="80" autocomplete="off" /></label>
        <label>Persona participante <input id="participant" maxlength="80" /></label>
        <label>Notas <input id="notes" maxlength="300" /></label>
        <button id="save" disabled>Validar y guardar muestra</button>
        <p id="sample-summary">Aún no hay una captura.</p>
      </section>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
