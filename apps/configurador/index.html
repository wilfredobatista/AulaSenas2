<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AulaSenas · Configurador</title>
    <style>
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      :root { font-family: Arial, sans-serif; color: #1f2937; background: #f4f7fb; --admin-accent: #0f766e; --admin-accent-dark: #115e59; --admin-soft: #ecfdf5; --admin-border: #d8dee6; }
      body { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 0 1.25rem 1rem; }
      header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin: 0 -1.25rem 1rem; padding: .7rem 1.25rem; background: var(--admin-accent-dark); color: #fff; }
      header h1 { margin: 0; font-size: 1.55rem; }
      main { display: grid; grid-template-columns: minmax(0, 2fr) minmax(300px, 1fr); gap: 1rem; align-items: start; }
      section { background: #fff; border: 1px solid var(--admin-border); border-radius: 12px; padding: .8rem; box-shadow: 0 8px 24px #172b4d0d; }
      section h2 { margin: 0; color: var(--admin-accent-dark); }
      .preview-stage { position: relative; width: 100%; min-height: 220px; max-height: calc(100vh - 16rem); aspect-ratio: 16 / 9; overflow: hidden; border-radius: 10px; background: #111827; }
      /* Video reserva espacio para transporte y segmentación sin afectar la cámara. */
      @media (min-width: 900px) { .preview-stage:not(.camera-mirrored) { max-height: calc(100vh - 19rem); } }
      video { display: block; width: 100%; height: 100%; background: #111827; object-fit: contain; }
      #landmark-overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      /* Selfie solo visual: video y overlay se espejan juntos; los datos no se transforman. */
      .preview-stage.camera-mirrored > video, .preview-stage.camera-mirrored > #landmark-overlay { transform: scaleX(-1); }
      label { display: grid; gap: .25rem; margin: .42rem 0; color: #475569; font-size: .84rem; }
      input, select, button { font: inherit; padding: .42rem .58rem; border-radius: 8px; border: 1px solid #cbd5e1; }
      input:focus, select:focus { outline: 3px solid #99f6e4; border-color: var(--admin-accent); }
      button { width: auto; cursor: pointer; background: var(--admin-accent); color: #fff; border-color: var(--admin-accent); font-weight: 600; transition: background .15s ease; }
      button:hover:not(:disabled) { background: var(--admin-accent-dark); }
      button.secondary { background: #fff; color: var(--admin-accent-dark); border-color: #99f6e4; }
      button.secondary:hover:not(:disabled), button.active { background: var(--admin-soft); color: var(--admin-accent-dark); }
      button:disabled { opacity: .5; cursor: not-allowed; }
      .actions { display: flex; align-items: center; flex-wrap: wrap; gap: .45rem; margin: .45rem 0; }
      .capture-heading { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin-bottom: .5rem; }
      .capture-heading-controls { display: flex; align-items: center; justify-content: flex-end; gap: .55rem; min-width: 0; }
      .mode-switch { flex-wrap: nowrap; margin: 0; }
      .mode-switch button, .compact-button { padding: .42rem .6rem; }
      .video-file-control { display: flex; align-items: center; gap: .45rem; min-width: 0; margin: 0; }
      .video-file-control input { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
      .video-file-button { display: inline-flex; align-items: center; padding: .42rem .6rem; border: 1px solid #99f6e4; border-radius: 8px; color: var(--admin-accent-dark); background: #fff; font-weight: 600; cursor: pointer; white-space: nowrap; }
      .video-file-control input:focus-visible + .video-file-button { outline: 3px solid #99f6e4; }
      .video-file-name { max-width: 13rem; overflow: hidden; color: #475569; font-size: .8rem; text-overflow: ellipsis; white-space: nowrap; }
      .capture-controls { padding: .45rem 0 0; }
      #camera-controls { display: flex; align-items: center; gap: .55rem; flex-wrap: wrap; }
      #camera-controls .actions { margin: 0; }
      .capture-controls .primary-action { min-width: 9.5rem; }
      .sample-summary { flex: 1 1 10rem; margin: 0; color: #475569; font-size: .82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .video-transport { display: grid; grid-template-columns: 1fr 1fr 1.2fr 1fr 1fr; gap: .45rem; margin: 0; }
      .video-transport button { width: 100%; min-width: 0; padding-block: .36rem; white-space: nowrap; }
      #play-pause { font-size: 1.05rem; }
      .video-timeline { margin-top: .3rem; padding-top: .3rem; border-top: 1px solid #e2e8f0; }
      .time-info { color: #475569; font-size: .82rem; text-align: center; }
      .segment-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; gap: .45rem; margin-top: .25rem; }
      .segment-control { display: grid; justify-items: center; gap: .25rem; }
      .segment-control button, #process-segment { width: 100%; }
      .segment-selected { border-color: var(--admin-accent-dark) !important; background: var(--admin-soft) !important; color: var(--admin-accent-dark) !important; }
      .segment-invalid { border-color: #d97706 !important; background: #fffbeb !important; color: #92400e !important; }
      .segment-feedback { overflow: hidden; font-size: .8rem; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
      .segment-feedback.segment-success { color: #047857; }
      .segment-feedback.segment-warning { color: #a16207; }
      .segment-feedback.segment-error { color: #b91c1c; }
      .catalog-heading { display: flex; align-items: center; justify-content: space-between; gap: .65rem; margin-bottom: .55rem; }
      .dataset-state { display: flex; align-items: center; gap: .35rem; min-width: 0; }
      .dataset-state strong { color: var(--admin-accent-dark); white-space: nowrap; }
      #dataset-status { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .82rem; }
      .catalog-actions { flex-wrap: nowrap; margin: 0; }
      .active-class-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: .55rem; margin-bottom: .35rem; }
      .active-class-row label { min-width: 0; margin: 0; }
      .active-class-row select { width: 100%; }
      .class-fields { display: grid; grid-template-columns: minmax(0, 7fr) minmax(8rem, 3fr); gap: .7rem; }
      .class-fields label { min-width: 0; }
      .class-fields input, .class-fields select { width: 100%; }
      #status { min-height: 1.5rem; padding: .45rem .7rem; border-radius: 8px; color: #d1fae5; background: #134e4a; }
      .error { color: #fecaca !important; background: #7f1d1d !important; }
      fieldset { min-inline-size: 0; margin: .55rem 0 0; padding: 0; border: 0; }
      fieldset legend { width: 100%; margin: 0 0 .42rem; padding: 0; color: #475569; font-size: .84rem; }
      .meanings-box { padding: .55rem; border: 1px solid #e2e8f0; border-radius: 10px; }
      output { color: var(--admin-accent-dark); font-weight: 600; }
      @media (max-width: 899px) { body { padding: 0 1.25rem 1.5rem; } header { margin: 0 -1.25rem 1.5rem; padding: 1.1rem 1.25rem; flex-direction: column; } main { grid-template-columns: 1fr; } .preview-stage { max-height: none; } }
      @media (max-width: 600px) { body { padding: 0 .75rem 1rem; } header { margin: 0 -.75rem 1rem; padding: .8rem .75rem; } header h1 { font-size: 1.4rem; } section { padding: .75rem; } .actions button { flex: 0 1 auto; } .preview-stage { min-height: 190px; } #status { width: 100%; } .capture-heading { align-items: flex-start; } .capture-heading-controls { align-items: flex-end; flex-direction: column; } .video-file-name { max-width: 10rem; } .video-transport { gap: .25rem; } .video-transport button { padding-inline: .3rem; } .catalog-heading { align-items: flex-start; flex-direction: column; } .active-class-row { grid-template-columns: 1fr; } .active-class-row button { justify-self: end; } .class-fields { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <header><h1>Configurador AulaSenas2-Lite · Hands + Pose · F139</h1><span id="status" role="status">Listo</span></header>
    <main>
      <section class="capture-panel">
        <div class="capture-heading">
          <h2>Captura visual</h2>
          <div class="capture-heading-controls">
            <div class="actions mode-switch" role="group" aria-label="Fuente de captura">
              <button id="mode-camera" class="secondary active" type="button" aria-pressed="true">Cámara</button>
              <button id="mode-video" class="secondary" type="button" aria-pressed="false">Video</button>
            </div>
            <label id="video-file-control" class="video-file-control" hidden>
              <input id="video-file" type="file" accept="video/*" />
              <span class="video-file-button">📁 Elegir video</span>
              <span id="video-file-name" class="video-file-name" title="Ningún video seleccionado">Ningún video</span>
            </label>
          </div>
        </div>
        <div id="preview-stage" class="preview-stage camera-mirrored">
          <video id="preview" playsinline muted></video>
          <canvas id="landmark-overlay" aria-hidden="true"></canvas>
        </div>
        <div id="camera-controls" class="capture-controls">
          <div class="actions">
            <button id="camera-toggle" type="button">Activar cámara</button>
            <button id="capture-toggle" class="primary-action" type="button" disabled>Iniciar captura</button>
          </div>
          <p id="sample-summary" class="sample-summary" aria-live="polite">Aún no hay captura</p>
        </div>
        <div id="video-controls" class="capture-controls" hidden>
          <div class="actions video-transport" aria-label="Navegación del video">
            <button id="back-quarter" class="secondary compact-button" type="button" aria-label="Retroceder 0.25 segundos" title="Retroceder 0.25 segundos" disabled>⏪ 0.25s</button>
            <button id="back-frame" class="secondary compact-button" type="button" aria-label="Frame anterior" title="Frame anterior" disabled>⏮</button>
            <button id="play-pause" class="secondary compact-button" type="button" aria-label="Reproducir" title="Reproducir" disabled>▶</button>
            <button id="forward-frame" class="secondary compact-button" type="button" aria-label="Frame siguiente" title="Frame siguiente" disabled>⏭</button>
            <button id="forward-quarter" class="secondary compact-button" type="button" aria-label="Avanzar 0.25 segundos" title="Avanzar 0.25 segundos" disabled>0.25s ⏩</button>
          </div>
          <div class="video-timeline">
            <div class="time-info"><span>Posición <output id="current-time">00:00</output> / <output id="video-duration">00:00</output></span><span id="segment-feedback" class="segment-feedback" role="status">Sin segmento</span></div>
            <div class="segment-grid">
              <div class="segment-control"><button id="mark-start" class="secondary compact-button" type="button" aria-pressed="false" disabled>Marcar inicio</button><output id="segment-start">00:00.000</output></div>
              <div class="segment-control"><button id="mark-end" class="secondary compact-button" type="button" aria-pressed="false" disabled>Marcar fin</button><output id="segment-end">00:00.000</output></div>
              <button id="process-segment" class="compact-button" type="button" disabled>Procesar segmento</button>
            </div>
          </div>
        </div>
      </section>

      <section class="class-panel">
        <div class="catalog-heading">
          <div class="dataset-state" aria-live="polite"><strong>Dataset local</strong><span aria-hidden="true">—</span><span id="dataset-status">Conectando…</span></div>
          <div class="actions catalog-actions">
            <button id="new-class" class="compact-button" type="button">+ Nueva clase</button>
            <button id="edit-class" class="secondary compact-button" type="button" disabled>Editar</button>
          </div>
        </div>
        <div class="active-class-row">
          <label>Clase activa <select id="class-selector"><option value="">Sin clases</option></select></label>
          <button id="delete-last" class="secondary compact-button" type="button" disabled>Borrar última muestra</button>
        </div>
        <form id="class-form">
          <div class="class-fields">
            <label>Glosa <input id="class-glosa" required maxlength="80" autocomplete="off" /></label>
            <label>Tipo <select id="class-type"><option value="" disabled>Seleccione tipo</option><option value="normal">Seña normal</option><option value="ruido_background">Ruido / background</option></select></label>
          </div>
          <fieldset id="meanings-field"><legend>Posibles significados</legend><div class="meanings-box"><div id="meanings"></div><button id="add-meaning" class="secondary" type="button">Agregar significado</button></div></fieldset>
          <div class="actions"><button id="save-class" type="submit" hidden>Guardar</button><button id="cancel-class" class="secondary" type="button" hidden>Cancelar</button></div>
        </form>
      </section>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
